name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # المفتاح العام (publishable) آمن للنشر: يظهر في المتصفح لكل الزوار أصلاً
      NEXT_PUBLIC_SUPABASE_URL: https://omuqbocsbkkzakboegfq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_6z09nk03YCQpmsEEssSvDQ_r1CsK04v
      # الموقع يُنشر تحت /اسم-المستودع
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
